            width: 100% !important;
            max-width: 100% !important;
            height: 64px !important;

            font-weight: 500 !important;
            color: #1e293b !important;
            min-height: 32px !important;
            position: static !important;
            opacity: 1 !important;
            margin: 0 !important;
            padding: 0 !important;

            vertical-align: middle !important;
        }
        
        /* Ensure the input stays visible when items are selected */
        .ts-wrapper.has-items .ts-control > input {
            visibility: visible !important;
            opacity: 1 !important;
            margin-left: 8px !important;
            position: relative !important;
            left: auto !important;

        /* Hover and focus states */

            border-color: #cbd5e1 !important;
            background-color: #ffffff !important;
        }

            border-color: #4361ee !important;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15) !important;
            background-color: #ffffff !important;

        /* Category header styling for team categories */
        .ts-dropdown .optgroup-header {

            font-size: 11px !important;
            text-transform: uppercase !important;
            font-weight: 700 !important;
            letter-spacing: 0.05em !important;
            color: #64748b !important;
            background: transparent !important;
        }
        
        /* Option styling */
        .ts-dropdown .option {
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin: 3px 0 !important;
            font-weight: 500 !important;
            color: #1e293b !important;
            display: flex !important;
            align-items: center !important;
            position: relative !important;
            cursor: pointer !important;
        }
        
        /* Betting odds-like styling for active item */
        .ts-dropdown .active {
            background: #4361ee !important;
            color: white !important;
            box-shadow: 0 4px 8px -2px rgba(67, 97, 238, 0.25) !important;
        }
        
        /* Hover state */
        .ts-dropdown .option:hover:not(.active) {
            background-color: #f1f5f9 !important;
        }
        
        /* Scrollbar styling */
        .ts-dropdown .ts-dropdown-content::-webkit-scrollbar {
            width: 6px !important;
        }

            background: #f1f5f9 !important;

        .ts-dropdown .option.selected:not(.active) {
            background-color: #f1f5f9 !important;
            font-weight: 600 !important;
            color: #4361ee !important;

            font-size: 16px !important;

            background-color: #eff6ff !important;
            color: #1e40af !important;
            font-weight: 600 !important;

        /* Create layout control */

            align-items: center !important;
            justify-content: flex-start !important;
            padding-right: 40px !important; /* Space for arrow */

            border-color: #4361ee !important;
            background-color: #ffffff !important;

            padding: 12px 16px !important;

        /* Loading indicator */
        .ts-wrapper.loading .ts-control::before {
            border-color: #4361ee transparent transparent transparent !important;
        }
        
        /* Disable item styling */
        .ts-dropdown .option.disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;

            background-color: #f8fafc !important;

            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.15) !important;
            border-color: #4361ee !important;

        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(135deg, #4361ee, #4cc9f0);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

</head>
<body class="min-h-screen font-sans flex justify-center items-center p-4 md:p-8 bg-primaryDark">
    <div class="page-background fixed inset-0 bg-gradient-to-br from-primary to-secondary opacity-90 -z-20"></div>
    <div class="page-overlay fixed inset-0 bg-black bg-opacity-30 -z-10"></div>
    
    <div class="container w-full max-w-4xl bg-white bg-opacity-98 rounded-3xl shadow-2xl overflow-hidden relative z-10 backdrop-blur-md mt-0 md:-mt-12">
        <div class="h-1.5 w-full bg-gradient-to-r from-primary to-secondary"></div>
        
        <div class="bg-gradient-to-r from-primary to-secondary text-white p-6 md:p-10 text-center relative overflow-hidden">
            <h1 class="text-2xl md:text-4xl font-bold text-white mb-2 relative z-10">College Baseball Odds Hub</h1>
        </div>
        
        <div class="p-4 md:p-10 bg-gradient-to-br from-white to-gray-50 relative z-10">
            <form id="prediction-form" method="POST" action="/" class="bg-white p-4 md:p-8 rounded-2xl shadow mb-8">
                <div class="flex flex-col md:flex-row items-start gap-2 md:gap-2">
                    <div class="w-full md:w-[47%]">
                        <label for="away_team" class="block text-xs font-semibold text-textPrimary uppercase tracking-wider mb-2">Away Team</label>
                        <select id="away_team" name="away_team" required class="w-full">
                        </select>
                    </div>
                    
                    <div class="flex items-center justify-center py-2 md:py-0 w-full md:w-[6%] md:self-center md:mt-4">
                        <span class="px-2 text-2xl font-bold text-[black]">@</span>
                    </div>
                    
                    <div class="w-full md:w-[47%]">
                        <label for="home_team" class="block text-xs font-semibold text-textPrimary uppercase tracking-wider mb-2">Home Team</label>
                        <select id="home_team" name="home_team" required class="w-full">
                        </select>
                    </div>
                </div>
                
                <div class="mt-8 flex justify-center">
                    <button id="predict-button" type="submit" disabled 
                        class="bg-gradient-to-r from-primary to-secondary text-white py-2.5 px-16 text-lg font-semibold rounded-xl cursor-pointer transition duration-300 uppercase tracking-wider shadow-md hover:shadow-lg hover:brightness-110 disabled:opacity-50 disabled:cursor-not-allowed w-full md:w-auto md:min-w-[300px]">
                        Predict
                    </button>
                </div>
            </form>

            <div id="loading" class="hidden text-center py-12">
                <div class="inline-block w-12 h-12 border-4 border-gray-200 border-t-primary rounded-full animate-spin"></div>
                <div class="mt-6 text-textSecondary text-base font-medium">Calculating prediction...</div>
            </div>

            <div id="prediction-result"></div>

            {% if error %}
            <div class="bg-red-50 text-red-600 p-6 rounded-xl text-sm mt-6 border border-red-200 shadow-sm">{{ error }}</div>
            {% endif %}
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

            });
            
            const awaySelect = new TomSelect('#away_team', {
                create: false,
                allowEmptyOption: false,
                maxOptions: 2000,
                dropdownParent: null
            });

            // Set default selections on initialization
            setTimeout(() => {
                // Set default values - select popular teams
                homeSelect.setValue('LSU');
                awaySelect.setValue('Texas');
                
                // Update button state since we have both teams selected
                document.getElementById('predict-button').disabled = false;

                const homeValue = homeSelect.getValue();
                const awayValue = awaySelect.getValue();
                
                homeSelect.clearOptions();
                awaySelect.clearOptions();
                
                // Add all teams back to both dropdowns
                teams.forEach(team => {
                    homeSelect.addOption({value: team, text: team});
                    awaySelect.addOption({value: team, text: team});

                // Now remove the opposing team from each dropdown

                    awaySelect.removeOption(homeValue, true);

                                                <div class="text-center">
                                                    <div class="text-xs text-textSecondary mb-2">${formData.away_team}</div>
                                                    <div class="text-xl font-bold text-primary">${prediction.MoneyLine.away_decimal_odds}</div>
                                                    </div>
                                                <div class="text-center">
                                                    <div class="text-xs text-textSecondary mb-2">${formData.home_team}</div>
                                                    <div class="text-xl font-bold text-primary">${prediction.MoneyLine.home_decimal_odds}</div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="bg-white p-6 rounded-xl shadow-sm transition-all duration-300 hover:translate-y-[-2px] hover:shadow-md">
                                            <div class="text-sm font-semibold text-textSecondary mb-4 uppercase tracking-wider">Game Total: ${prediction.OverUnder.total_line}</div>
                                            <div class="flex justify-between items-center">
                                                    <div>
                                                    <div class="text-xs text-textSecondary">Over</div>
                                                    <div class="text-base font-semibold text-primary">${prediction.OverUnder.over_probability_percent}%</div>
                                                    </div>
                                                <div class="text-sm text-textSecondary">(${prediction.OverUnder.over_decimal_odds})</div>
                                                    <div>
                                                    <div class="text-xs text-textSecondary">Under</div>
                                                    <div class="text-base font-semibold text-primary">${prediction.OverUnder.under_probability_percent}%</div>
                                                </div>
                                                <div class="text-sm text-textSecondary">(${prediction.OverUnder.under_decimal_odds})</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById('prediction-result').innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('loading').classList.remove('flex');
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('prediction-result').innerHTML = `
                        <div class="bg-red-50 text-red-600 p-6 rounded-xl text-sm mt-6 border border-red-200 shadow-sm">
                            An error occurred while processing your request. Please try again.
                            </div>
                        `;
                    console.error("AJAX Error:", error);
                });
            });
        });
    </script>
</body>
</html>
